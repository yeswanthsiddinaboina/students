<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Predictor</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #101d3a, #263e70, #536ca8);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            color: #172d55;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .header p {
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #273957;
            font-weight: bold;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dbea;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #4169e1;
            box-shadow: 0 0 5px rgba(65,105,225,0.3);
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #244b91, #5278d5);
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        .result {
            margin-top: 22px;
            padding: 18px;
            background: #e8f7ed;
            border-left: 5px solid #269c55;
            border-radius: 9px;
            text-align: center;
            color: #176c38;
        }

        .error {
            margin-top: 20px;
            padding: 15px;
            background: #ffeaea;
            color: #b42318;
            border-radius: 8px;
        }

        .footer {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Student Performance Predictor</h1>
        <p>Machine Learning Based Performance Prediction System</p>
    </div>

    <form action="/predict" method="POST">

        <div class="form-group">
            <label>Hours Studied</label>
            <input type="number" step="any" min="0" max="24"
                   name="hours_studied" placeholder="Enter study hours" required>
        </div>

        <div class="form-group">
            <label>Previous Scores</label>
            <input type="number" step="any" min="0" max="100"
                   name="previous_scores" placeholder="Enter previous scores" required>
        </div>

        <div class="form-group">
            <label>Extracurricular Activities</label>
            <select name="extracurricular" required>
                <option value="">Select an option</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </div>

        <div class="form-group">
            <label>Sleep Hours</label>
            <input type="number" step="any" min="0" max="24"
                   name="sleep_hours" placeholder="Enter sleep hours" required>
        </div>

        <div class="form-group">
            <label>Sample Question Papers Practiced</label>
            <input type="number" step="any" min="0"
                   name="question_papers" placeholder="Enter number of papers" required>
        </div>

        <button type="submit">Predict Performance</button>

    </form>

    {% if prediction is defined %}
    <div class="result">
        <h2>Prediction Result</h2>
        <h1>{{ prediction }} / 100</h1>
        <p>Predicted Student Performance Index</p>
    </div>
    {% endif %}

    {% if error %}
    <div class="error">
        <strong>Error:</strong> {{ error }}
    </div>
    {% endif %}

    <div class="footer">
        Student Performance Regression Project
    </div>

</div>

</body>
</html>
